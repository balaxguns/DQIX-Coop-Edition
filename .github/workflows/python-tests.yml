name: Test safe save tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q tools tests
      - name: Run synthetic-save unit tests
        run: python -m unittest discover -s tests -v

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C hook with warnings as errors
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_native_vocation.c -o /tmp/test_native_vocation
      - name: Run synthetic-save tests
        run: /tmp/test_native_vocation
